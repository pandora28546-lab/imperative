<title>Лети, прыгай, плыви</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one full-screen game field (whole 1600×900 always visible); prototype scene switcher floats on top. */
:root{--blue-500:#6B91D6;--blue-050:#EAF1FF;--ink:#2C3A5C;--accent:#F97A4F;--font-ui:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;color-scheme:light}
html,body{margin:0;overflow:hidden;background:#EAF1FF;color:var(--ink);font-family:var(--font-ui);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.chips{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);display:flex;gap:6px;padding:5px;border-radius:999px;background:rgba(255,255,255,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:5}
.chip{font:800 14px/1 var(--font-ui);color:var(--blue-500);background:transparent;border:0;border-radius:999px;padding:9px 16px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--blue-500);color:#fff}
.chip:focus-visible,.round:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.round{position:absolute;border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;box-shadow:0 10px 0 rgba(44,58,92,.14),0 18px 40px rgba(44,58,92,.18);z-index:6}
#startBtn{left:50%;top:50%;width:clamp(64px,15vmin,132px);height:clamp(64px,15vmin,132px);transform:translate(-50%,-50%);background:var(--accent)}
#startBtn svg{width:44%;height:44%;margin-left:6%}
#againBtn{right:calc(env(safe-area-inset-right,0px) + 28px);bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:clamp(52px,10vmin,84px);height:clamp(52px,10vmin,84px);background:var(--blue-500)}
#againBtn svg{width:48%;height:48%}
#veil{position:absolute;inset:0;background:rgba(234,241,255,.35);z-index:4}
@media (max-width:620px){.chip{font-size:12px;padding:7px 11px}}
html,body{min-height:100%}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;min-height:100dvh}
#stage{position:relative;width:min(820px,100%,calc((100dvh - 110px) * 1.497));aspect-ratio:2048/1368;border-radius:24px;overflow:hidden;background:#EAF1FF;box-shadow:0 16px 60px rgba(0,0,0,.25),0 4px 16px rgba(0,0,0,.15);touch-action:manipulation;flex:none}
.chips{position:static;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:5px;border-radius:999px;background:#FFFFFF;box-shadow:0 2px 10px rgba(44,58,92,.08)}
#startBtn{width:16%;height:auto;aspect-ratio:1}
#againBtn{right:3%;bottom:4%;width:10%;height:auto;aspect-ratio:1}
</style>
